
name: Package and Publish Skill

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Skill
        shell: bash
        run: |
          test -f production-helper/SKILL.md || {
            echo "ERROR: SKILL.md not found"
            exit 1
          }

      - name: Build ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/production-helper.zip production-helper

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-helper
          path: dist/production-helper.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/production-helper.zip \
            --title "Production Helper $GITHUB_REF_NAME" \
            --generate-notes
