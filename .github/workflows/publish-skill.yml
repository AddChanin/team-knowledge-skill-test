
name: Package Skill for Claude

on:
  push:
    branches:
      - main
    paths:
      - "skills/ignition-issue-guide/**"
      - ".github/workflows/package-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-skill:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Validate Skill
        run: |
          test -f skills/ignition-issue-guide/SKILL.md || {
            echo "ERROR: SKILL.md was not found."
            exit 1
          }

      - name: Create Claude ZIP
        run: |
          mkdir -p dist
          cd skills
          zip -r ../dist/ignition-issue-guide.zip ignition-issue-guide
          cd ..
          unzip -l dist/ignition-issue-guide.zip

      - name: Upload ZIP for download
        uses: actions/upload-artifact@v7
        with:
          name: ignition-issue-guide-for-claude
          path: dist/ignition-issue-guide.zip
          if-no-files-found: error
          retention-days: 90
